[project]
name = "writers-bot"
version = "4.5.1"
description = "Telegram (and Discord) bot for writers: prompts, writing sprints with word reports, word counter."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot[rate-limiter,webhooks]>=22.8,<23",
    "httpx>=0.28.1",
    "aiosqlite>=0.22.1",
    "pycrdt>=0.14.8",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.62.0",
    "aiohttp>=3.12",
    "pillow>=11",
    "d20>=1.1.2",
    "imageio-ffmpeg>=0.6.0",  # core/stitch.py: dice stickers stitched with ffmpeg
]

[project.optional-dependencies]
discord = ["discord.py>=2.7.1,<3"]
google-auth-setup = ["google-auth-oauthlib>=1.5.0"]

[project.scripts]
writers-bot = "writers_bot.main:main"
writers-bot-telegram = "writers_bot.main:main_telegram"
writers-bot-discord = "writers_bot.main:main_discord"

[dependency-groups]
render = [  # scripts/dice_render: the dice sticker clips, drawn with Babylon.js in headless Chromium
    "imageio-ffmpeg>=0.6.0",
    "numpy>=2",
    "playwright>=1.50",
    "scipy>=1.14",
]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "quickjs>=1.19.4",
    "ruff>=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/writers_bot"]

[tool.ruff]
line-length = 119
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "S311", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# d20's parser (lark-parser 0.9) imports sre_parse and sre_constants, deprecated but present in Python 3.13
filterwarnings = ["ignore:module 'sre_(parse|constants)' is deprecated:DeprecationWarning"]
