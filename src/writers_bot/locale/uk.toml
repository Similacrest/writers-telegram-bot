# Section heading for % works: always the share of what each person planned for this sprint
percent = "% від плану"
# Total over the words section (only visible numbers)
total = "Разом: {total}"
# Goals reached during this sprint, in the summary line: "Цілі досягнуто: Alice — «Роман»"
goals = "Цілі досягнуто: {list}"
# A work in the goals line whose title is hidden
goal_hidden = "ціль"
# People who joined and haven't reported yet (shown while reports are open)
writing = "Ще пишуть: {names}"
# Hint at the bottom while reports are open; {until} is a time
hint = "Звіт — відповіддю на це повідомлення (500, +300, =5000, посилання) або кнопками. Пізні звіти — до {until}."
# The same on Discord
hint_discord = "Звіт — кнопкою «Звітувати» (поле на кожен твір), ✓ чи ✗, або /progress. Пізні звіти — до {until} чи до вашого наступного спринту."
# Final board with no reports at all
nobody = "Ніхто не прозвітував."

# ------------------------------------------------------------------------------------------------
[report]
# The question posted by the "Звітувати" button (a reply prompt; deleted after the answer)
ask = "{who}, скільки написали? Відповідайте на це повідомлення числом (500), загальною кількістю (=5000) чи посиланням."
# The same when the person has several works in the sprint
ask_works = "{who}, скільки за кожен твір ({works})? Напр.: 300 роман 200 есе."
# Placeholder in the input field for that reply
placeholder = "500 або посилання"
# Two works share the unit, so the bot asks where {value} goes (private, with a button per work)
which_work = "Куди записати {value}?"
# Button next to the works: give each work its own number
split = "Розділити"
# Button under the question: a card to pause works you're not writing now (then the bot asks less)
pause = "⏸ Пауза…"
