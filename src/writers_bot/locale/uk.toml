# User-facing texts of the bot (Ukrainian).
#
# Every key has a comment saying where the text appears. Placeholders in {braces} are filled in by the
# bot; keep them (you can move them). Formatting (bold, links, mentions) is added by the bot around the
# placeholders, so write plain text here: <, > and & are fine and are shown as is.
#
# A list of strings is either plural forms (1 / 2–4 / 5+), a set of alternatives the bot picks from at
# random, or a list of words the bot understands in messages (says so in the comment).

[plural]
# "1 хвилину, 2 хвилини, 5 хвилин": sprint lengths and minutes, as in "Пишемо 30 хвилин"
minutes = ["хвилину", "хвилини", "хвилин"]
# word counts: "500 слів", reports, totals, goals
words = ["слово", "слова", "слів"]
# /count output: number of characters
characters = ["символ", "символи", "символів"]
# /count output: number of letters
letters = ["літера", "літери", "літер"]
# number of sprints in /top, /profile and the share line
sprints = ["спринт", "спринти", "спринтів"]
# number of works whose titles are hidden, on the sprint message: "Bob — 2 твори"
works = ["твір", "твори", "творів"]
# days in a row (streak) in /profile and the share line
days = ["день", "дні", "днів"]

# ------------------------------------------------------------------------------------------------
[input]
# Words the bot understands in reports (replies to sprint messages and /progress). Lower case.

# after a number, mean "words" and are ignored: "500 слів"
unit_words = ["слів", "слова", "слово", "сл", "сл.", "words", "word", "w"]
# after a number, mean percent: "50 відсотків"
percent_words = ["відсотків", "відсотки", "відсоток", "percent", "%"]
# a report of "Done ✓" without a number
done_words = ["✓", "✔", "✔️", "✅", "готово", "done", "зроблено"]
# a report of "didn't make it ✗" (single words)
failed_words = ["✗", "✘", "❌", "fail", "failed"]
# the same as phrases (can contain spaces)
failed_phrases = ["не вийшло", "не встиг", "не встигла", "didn't make it"]
# today, for /progress
today_words = ["сьогодні", "today"]
# yesterday, for /progress
yesterday_words = ["вчора", "учора", "yesterday"]
# the day before yesterday, for /progress
day_before_words = ["позавчора"]

# ------------------------------------------------------------------------------------------------
[sprint]
