# Starting counts (v3.3 sprints restored from the database): "Старт: Alice — 12000"
baselines = "Старт: {list}"
# Hint at the bottom of the sprint message before the start
hint_planned = "Долучайтеся кнопкою нижче."
# Hint at the bottom of the sprint message while it runs
hint_running = "Звіт — відповіддю на це повідомлення або кнопками в кінці."
# The same on Discord, where the bot doesn't read messages
hint_running_discord = "Звіт — кнопкою «Звітувати» в кінці або командою /progress."
# After a name on the sprint message when some of the person's works hide their titles: "Роман, ще 1"
more_works = "ще {n}"

# Buttons under the sprint message
