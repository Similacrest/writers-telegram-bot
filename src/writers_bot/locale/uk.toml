already_running = "Спринт вже запущено."

# Headline of the pinned sprint message before the start; {minutes} is e.g. "2 хвилини"
head_planned = "Спринт почнеться за {minutes}"
# The same in the v2 sprint flow (sprints without reports)
head_planned_v2 = "Спринт почнеться за {minutes}!"
# Headline while the sprint runs (this message is sent anew at the start, so people get notified)
head_running = "Спринт розпочався!"
# Headline when a planned sprint was cancelled before it started
head_cancelled = "Спринт скасовано до його початку"
# Headline when a running sprint was stopped early
head_stopped = "Спринт зупинено"
# Headline when the sprint ended on time
head_finished = "Спринт завершено!"
# Second line of the sprint message, before the start: "Писатимемо 30 хвилин, з 14:00 до 14:30."
when_planned = "Писатимемо {duration}, з {start} до {end}."
# Second line while running
when_running = "Пишемо {duration}, з {start} до {end}."
# Second line when cancelled
when_cancelled = "Не писали {duration}, з {start} до {end}."
# Second line when stopped early ({duration} is how long it actually ran)
when_stopped = "Писали всього {duration}, з {start} до {end}."
