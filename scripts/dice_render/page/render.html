<!doctype html>
<meta charset="utf-8">
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<canvas id="c" width="1024" height="1024"></canvas>
<script src="babylon.js"></script>
<script>
// Deterministic render of the "Dice of Rolling" theme (Frank Ali, 3d-dice/dice-themes) with Babylon.js:
// no physics and no recording; each die is posed so the face with the wanted number looks at the camera.
// Driven by render.py: window.setup(spec) builds the scene, window.frame(i) draws frame i and returns a PNG data URL.
const B = BABYLON;
const canvas = document.getElementById("c");
const LAND = 24, SETTLE = 8; // a slower roll: 0.8 s
let engine, scene, camera, theme, items = [];

const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const mul = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const unit = (a) => { const l = Math.hypot(...a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
const rng = (seed) => () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; };

function tri(pos, idx, t) {
  return [0, 1, 2].map((k) => { const i = idx[t * 3 + k]; return [pos[i * 3], pos[i * 3 + 1], pos[i * 3 + 2]]; });
}

// the wanted face: its outward normal (from the collider) and the texture's "up" there (from the uvs)
function face(sides, value, mesh, roll) {
  if (sides === 10 && value === 10) value = 0; // the d10's tenth face reads 0
  const col = theme.meshes.find((m) => m.name === `d${sides}_collider`);
  const map = theme.colliderFaceMap[`d${sides}`];
  const cp = col.positions, ci = col.indices;
  const ns = [];
  for (const k of Object.keys(map)) if (map[k] === value) {
    const [a, b, c] = tri(cp, ci, +k);
    let n = unit(cross(sub(b, a), sub(c, a)));
    const mid = mul(add(add(a, b), c), 1 / 3);
    if (dot(n, mid) < 0) n = mul(n, -1);
    ns.push(n);
  }
  let n = unit(ns.reduce(add, [0, 0, 0]));
  if (sides === 4) return face4(value, col, map);
  // v gradient over the mesh triangles lying on that face
  const pos = mesh.getVerticesData(B.VertexBuffer.PositionKind), uv = mesh.getVerticesData(B.VertexBuffer.UVKind);
  const idx = mesh.getIndices();
  let g = [0, 0, 0];
  for (let t = 0; t < idx.length / 3; t++) {
    const [p0, p1, p2] = tri(pos, idx, t);
    const tn = unit(cross(sub(p1, p0), sub(p2, p0)));
    if (dot(tn, n) < 0.97) continue;
    const v = [0, 1, 2].map((k) => uv[idx[t * 3 + k] * 2 + 1]);
    const e1 = sub(p1, p0), e2 = sub(p2, p0), dv1 = v[1] - v[0], dv2 = v[2] - v[0];
    const u1 = (uv[idx[t * 3 + 1] * 2] - uv[idx[t * 3] * 2]), u2 = (uv[idx[t * 3 + 2] * 2] - uv[idx[t * 3] * 2]);
    const det = u1 * dv2 - u2 * dv1;
    if (Math.abs(det) < 1e-9) continue;
    const dvdp = add(mul(e1, -u2 / det), mul(e2, u1 / det)); // 3D direction of growing v
    g = add(g, dvdp);
  }
  let up = unit(sub(g, mul(n, dot(g, n))));
  if (roll) { const c = Math.cos(roll), sn = Math.sin(roll); up = add(mul(up, c), mul(cross(n, up), sn)); }
  return { n, up };
}

// a d4 is read at the top vertex (the one opposite the collider face of that value): look straight at it
function corners4(col) { // the collider keeps 3 own vertices per face: the 4 distinct corners
  const pts = [];
  for (let i = 0; i < col.positions.length / 3; i++) {
    const p = [col.positions[i * 3], col.positions[i * 3 + 1], col.positions[i * 3 + 2]];
    if (!pts.some((q) => Math.hypot(...sub(p, q)) < 1e-3)) pts.push(p);
  }
  return pts;
}

function face4(value, col, map) {
  const ci = col.indices, cp = col.positions;
  const pts = corners4(col);
  const t = +Object.keys(map).find((k) => map[k] === value);
  const own = tri(cp, ci, t);
  const apex = pts.find((p) => !own.some((q) => Math.hypot(...sub(p, q)) < 1e-3));
  const t2 = [0, 1, 2, 3].find((k) => k !== t);
  const [a, b, c] = tri(cp, ci, t2);
  const centre = mul(pts.reduce(add, [0, 0, 0]), 0.25);
  const n = unit(sub(apex, centre)); // towards the camera
  const rel = sub(apex, mul(add(add(a, b), c), 1 / 3)); // one face's number sits below the vertex, reading upwards
  const up = unit(sub(rel, mul(n, dot(rel, n))));
  return { n, up, apex, edge: Math.hypot(...sub(pts[0], pts[1])) };
}

// the uv triangles of what was rolled: the face, or on a d4 the corners around its top vertex
function rolledTris(f, mesh, centre, radius) {
  const pos = mesh.getVerticesData(B.VertexBuffer.PositionKind), idx = mesh.getIndices();
  const out = [];
  for (let t = 0; t < idx.length / 3; t++) {
    const [p0, p1, p2] = tri(pos, idx, t);
    if (f.apex) {
      const mid = mul(add(add(p0, p1), p2), 1 / 3);
      if (Math.hypot(...sub(mid, f.apex)) < 0.5 * f.edge) out.push(t);
    } else { // lying flat towards f.n and out on that side of the die (the winding says nothing about which side)
      const tn = unit(cross(sub(p1, p0), sub(p2, p0)));
      const mid = mul(add(add(p0, p1), p2), 1 / 3);
      if (Math.abs(dot(tn, f.n)) >= 0.96 && dot(sub(mid, centre), f.n) > 0.3 * radius) out.push(t);
    }
  }
  return out;
}

const canvasOf = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };

// the uv triangles of a mesh (or some of them) as a white shape on a transparent canvas
function uvShape(mesh, w, h, tris, grow) {
  const uv = mesh.getVerticesData(B.VertexBuffer.UVKind), idx = mesh.getIndices();
  const c = canvasOf(w, h), m = c.getContext("2d");
  m.fillStyle = m.strokeStyle = "#fff";
  m.lineWidth = grow; m.lineJoin = "round";
  for (const t of tris || Array.from({ length: idx.length / 3 }, (_, i) => i)) {
    m.beginPath();
    for (let k = 0; k < 3; k++) { const i = idx[t * 3 + k]; m[k ? "lineTo" : "moveTo"](uv[i * 2] * w, (1 - uv[i * 2 + 1]) * h); }
    m.closePath(); m.fill(); m.stroke();
  }
  return c;
}

// the d12 and the d100's tens die come as light marble: give it a colour
function tintMarble(img, mesh, rgb) {
  const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
  const c = canvasOf(w, h), g = c.getContext("2d");
  g.drawImage(img, 0, 0);
  const tint = canvasOf(w, h), tg = tint.getContext("2d");
  tg.fillStyle = `rgb(${rgb.map((v) => Math.round(v * 255)).join(",")})`;
  tg.fillRect(0, 0, w, h);
  tg.globalCompositeOperation = "destination-in";
  tg.drawImage(uvShape(mesh, w, h, null, 3 * w / 512), 0, 0);
  g.globalCompositeOperation = "multiply";
  g.drawImage(tint, 0, 0);
  return c;
}

// The texture is two layers (prep_atlas.py): the marble, and the numerals as crisp white ink. Every numeral is faded
// except those of the rolled face; the colours stay.
const FADE = 0.3;
function composeAtlas(marble, ink, mesh, tris, gold) {
  const w = marble.naturalWidth || marble.width, h = marble.naturalHeight || marble.height;
  const base = canvasOf(w, h), g = base.getContext("2d");
  g.drawImage(marble, 0, 0);
  g.globalAlpha = FADE;
  g.drawImage(ink, 0, 0);
  g.globalAlpha = 1;
  g.fillStyle = "rgba(0,0,0,0.07)";
  g.fillRect(0, 0, w, h);
  const full = canvasOf(w, h), fg = full.getContext("2d");
  if (gold) fg.filter = "sepia(0.5) saturate(1.5) brightness(1.08)";
  fg.drawImage(marble, 0, 0);
  fg.drawImage(ink, 0, 0);
  const keep = canvasOf(w, h), kg = keep.getContext("2d");
  kg.drawImage(uvShape(mesh, w, h, tris, 5 * w / 512), 0, 0);
  kg.globalCompositeOperation = "source-in";
  kg.drawImage(full, 0, 0);
  g.drawImage(keep, 0, 0);
  return base.toDataURL("image/png");
}

function target(f) {
  // rotation taking the face normal to the camera (-z) and the number's up to +y
  const r = unit(cross(f.n, f.up));
  const m = [[r[0], r[1], r[2]], [f.up[0], f.up[1], f.up[2]], [-f.n[0], -f.n[1], -f.n[2]]]; // rows: new x, y, z
  const q = B.Quaternion.RotationQuaternionFromAxis(
    new B.Vector3(m[0][0], m[1][0], m[2][0]), new B.Vector3(m[0][1], m[1][1], m[2][1]), new B.Vector3(m[0][2], m[1][2], m[2][2]));
  return q;
}

// the d2: a 5 kopiyok coin, its two sides (public domain scan, Commons "5-kopiyok-Ukraine.jpg") on the caps of a short cylinder
async function coinAtlas() {
  const img = await new Promise((ok) => { const i = new Image(); i.onload = () => ok(i); i.src = "theme/5kop.jpg"; });
  const c = document.createElement("canvas"); c.width = c.height = 1024;
  const g = c.getContext("2d");
  g.fillStyle = "#8a8d93"; g.fillRect(0, 0, 1024, 1024);
  const side = (cx, cy, r, dx, flip) => {
    g.save(); g.beginPath(); g.arc(dx + 256, 256, 256, 0, 2 * Math.PI); g.clip();
    if (flip) { g.translate(0, 512); g.scale(1, -1); } // the cylinder's bottom cap is mapped upside down
    g.drawImage(img, cx - r, cy - r, 2 * r, 2 * r, dx, 0, 512, 512); g.restore();
  };
  side(1045, 360, 290, 0, false); // the coat of arms: the top cap
  side(361, 357, 290, 512, true); // "5 копійок": the bottom cap
  for (let x = 0; x < 1024; x += 14) { // the reeded edge
    g.fillStyle = (x / 14) % 2 ? "#6f7279" : "#b4b7bd"; g.fillRect(x, 512, 14, 512);
  }
  return new B.Texture(c.toDataURL("image/png"), scene, false, true);
}

window.setup = async (spec) => {
  if (engine) engine.dispose();
  engine = new B.Engine(canvas, true, { preserveDrawingBuffer: true, alpha: true, antialias: true });
  scene = new B.Scene(engine);
  scene.clearColor = new B.Color4(0, 0, 0, 0);
  theme = await (await fetch("theme/smoothDice.json")).json();
  const res = await B.SceneLoader.ImportMeshAsync("", "theme/", "smoothDice.json", scene, null, ".babylon");
  res.meshes.forEach((m) => m.setEnabled(false));
  const atlas = await new Promise((ok) => { const i = new Image(); i.onload = () => ok(i); i.src = "theme/marble.png"; });
  const inkImg = await new Promise((ok) => { const i = new Image(); i.onload = () => ok(i); i.src = "theme/ink.png"; });
  const mat = new B.StandardMaterial("m", scene);
  // the theme's own texture, for calibrate.py (dim: false); the stickers use the two layers (marble, ink) below.
  // No bump map: its low-resolution normals make dotted outlines on the numerals.
  mat.diffuseTexture = new B.Texture("theme/diffuse.jpg", scene, false, true);
  mat.diffuseTexture.anisotropicFilteringLevel = 16;
  mat.specularPower = 1; mat.specularColor = new B.Color3(0.12, 0.12, 0.12);
  camera = new B.FreeCamera("cam", new B.Vector3(0, 0, -9), scene);
  camera.setTarget(B.Vector3.Zero());
  camera.fov = 0.34;
  new B.HemisphericLight("h", new B.Vector3(0.3, 1, -0.6), scene).intensity = 0.55;
  const sun = new B.DirectionalLight("s", new B.Vector3(0.45, -0.6, 0.66), scene);
  sun.intensity = 0.7;
  if (spec.some((d) => d.sides === 4)) new B.DirectionalLight("fill", new B.Vector3(0.1, 0.75, 0.65), scene).intensity = 0.7;
  items = [];
  const coinTex = spec.some((d) => d.sides === 2) ? await coinAtlas() : null;
  spec.forEach((d, k) => {
    if (d.sides === 2) { // a coin: value 1 shows the coat of arms, 2 the denomination
      const mesh = B.MeshBuilder.CreateCylinder(`coin${k}`, {
        height: 0.17, diameter: 2, tessellation: 96,
        faceUV: [new B.Vector4(0.5, 0.5, 1, 1), new B.Vector4(0, 0, 1, 0.5), new B.Vector4(0, 0.5, 0.5, 1)],
      }, scene);
      const cm = new B.StandardMaterial(`coinm${k}`, scene);
      cm.diffuseTexture = coinTex; cm.diffuseTexture.anisotropicFilteringLevel = 16;
      cm.specularColor = new B.Color3(0.5, 0.5, 0.5); cm.specularPower = 24;
      mesh.material = cm;
      mesh.rotationQuaternion = B.Quaternion.Identity();
      const base = B.Quaternion.RotationAxis(new B.Vector3(1, 0, 0), d.value === 1 ? -Math.PI / 2 : Math.PI / 2);
      const q = B.Quaternion.RotationAxis(new B.Vector3(0, 0, 1), d.roll || 0).multiply(base);
      const r = rng(d.seed || 1);
      items.push({ mesh, d, f: {}, q, axis: unit([1, (r() - 0.5) * 0.3, (r() - 0.5) * 0.1]), turns: 2.5 + Math.floor(r() * 2), norm: (d.scale || 1) / mesh.getBoundingInfo().boundingSphere.radius, centre: B.Vector3.Zero() });
      return;
    }
    const src = res.meshes.find((m) => m.name === `d${d.sides}`);
    const mesh = src.clone(`die${k}`);
    mesh.setEnabled(true);
    mesh.position = B.Vector3.Zero();
    mesh.rotationQuaternion = B.Quaternion.Identity();
    const bb = src.getBoundingInfo().boundingSphere;
    const radius = d.sides === 4 ? bb.radius * 0.85 : bb.radius;
    let centre = bb.center;
    if (d.sides === 4) { // the d4's bounding box centre is not its centroid
      const c4 = corners4(theme.meshes.find((m) => m.name === 'd4_collider')).reduce(add, [0, 0, 0]);
      centre = new B.Vector3(c4[0] / 4, c4[1] / 4, c4[2] / 4);
    }
    // spin about the die's centre
    mesh.setPivotPoint(centre);
    const f = face(d.sides, d.value, src, d.roll || 0);
    const dm = mat.clone(`m${k}`);
    if (d.dim !== false) {
      dm.diffuseTexture = new B.Texture(composeAtlas(d.tint ? tintMarble(atlas, src, d.tint) : atlas, inkImg, src, rolledTris(f, src, [centre.x, centre.y, centre.z], bb.radius), d.gold), scene, false, true);
      dm.diffuseTexture.anisotropicFilteringLevel = 16;
    }
    mesh.material = dm;
    const r = rng(d.seed || 1);
    items.push({ mesh, d, f, q: target(f), axis: unit([r() - 0.5, r() - 0.5, r() - 0.5]), turns: 1.0 + r() * 0.5, norm: (d.scale || 1) / radius, centre });
  });
  await scene.whenReadyAsync();
  scene.render();
  return items.length;
};

const ease = (t) => 1 - Math.pow(1 - t, 3);
window.frame = (i) => {
  i = Math.round(i);
  for (const it of items) {
    const i0 = i;
    i = Math.max(0, i0 - (it.d.delay || 0)); // this die's own clock
    const t = Math.min(i / LAND, 1), e = ease(t);
    const spin = B.Quaternion.RotationAxis(new B.Vector3(...it.axis), it.turns * 2 * Math.PI * (1 - e));
    it.mesh.rotationQuaternion = spin.multiply(it.q);
    const after = Math.max(0, i - LAND);
    const pop = !it.d.fumble && after < SETTLE ? Math.sin((after / SETTLE) * Math.PI) * 0.06 * (1 - after / SETTLE) : 0;
    const grow = 0.5 + 0.5 * e;
    const s = it.norm * (grow + pop);
    it.mesh.scaling = new B.Vector3(s, s, s);
    const hop = Math.sin(Math.PI * t) * 0.5 * (1 - t);
    let sx = 0, sy = 0;
    if (it.d.fumble && i >= LAND) { // a heavy landing: it shudders instead of popping
      sx = 0.093 * Math.sin(after * 2.4) * Math.exp(-after / 2.5);
      sy = -0.037 * Math.abs(Math.sin(after * 1.9)) * Math.exp(-after / 2);
    }
    it.mesh.position = new B.Vector3((it.d.x || 0) + sx, hop + sy, 0);
    i = i0;
  }
  scene.render();
  return canvas.toDataURL("image/png");
};
</script>
